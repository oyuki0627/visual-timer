<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ビジュアルタイマー</title>
  <meta name="description" content="作業と休憩を、見てわかる円で切り替えるタイマー">
  <meta name="theme-color" content="#F0EDEA">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="タイマー">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <section id="view-timer" class="view on" aria-label="タイマー"></section>
    <section id="view-log" class="view" aria-label="きろく"></section>
    <section id="view-settings" class="view" aria-label="せってい"></section>
  </main>

  <nav class="tabbar" aria-label="画面の切り替え">
    <button data-act="tab" data-v="timer" class="on" id="tab-timer"></button>
    <button data-act="tab" data-v="log" id="tab-log"></button>
    <button data-act="tab" data-v="settings" id="tab-settings"></button>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
